name: Build RustDesk HQ (Android)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/android-hq.yml"]
permissions:
  contents: write
env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  T: aarch64-linux-android
jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
  android:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: {tool-cache: false, android: false, large-packages: false, swap-storage: false}
      - uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - run: sudo apt-get update && sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libclang-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config wget
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - name: HQ patches
        shell: python3 {0}
        run: |
          def ed(p, *pairs):
              s = open(p).read()
              for a, b in pairs:
                  assert s.count(a) == 1, (p, a)
                  s = s.replace(a, b)
              open(p, 'w').write(s)
          ed('libs/hbb_common/src/config.rs',
             ('DEFAULT_SETTINGS: RwLock<HashMap<String, String>> = Default::default();',
              'DEFAULT_SETTINGS: RwLock<HashMap<String, String>> = RwLock::new(std::iter::once((keys::OPTION_DIRECT_SERVER.to_owned(), "Y".to_owned())).collect());'),
             ('"balanced", vec!["best", "low", "custom"]', '"custom", vec!["best", "balanced", "low"]'),
             ('get_num_string(key, 50.0, 10.0, 0xFFF', 'get_num_string(key, 100.0, 10.0, 0xFFF'),
             ('get_num_string(key, 30.0, 5.0, 120.0)', 'get_num_string(key, 60.0, 5.0, 120.0)'),
             ('.unwrap_or(50.0);', '.unwrap_or(100.0);'))
          ed('flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt',
             ('if (isHalfScale == true &&', 'if (false && isHalfScale == true &&'))
          ed('flutter/android/app/build.gradle',
             ('applicationId "com.carriez.flutter_hbb"', 'applicationId "com.silcway.rustdeskhq"'))
          ed('flutter/android/app/src/main/AndroidManifest.xml',
             ('android:label="RustDesk"\n', 'android:label="RustDesk HQ"\n'))
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "${{ env.ANDROID_FLUTTER_VERSION }}"}
      - run: cd $(dirname $(dirname $(which flutter))) && git apply $GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: {ndk-version: "${{ env.NDK_VERSION }}", add-to-path: true}
      - uses: lukka/run-vcpkg@v11
        with: {vcpkgDirectory: /opt/artifacts/vcpkg, vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}", doNotCache: false}
      - run: ./flutter/build_android_deps.sh arm64-v8a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: bridge-artifact, path: ./}
      - uses: dtolnay/rust-toolchain@master
        with: {toolchain: "${{ env.RUST_VERSION }}", components: rustfmt}
      - uses: Swatinem/rust-cache@v2
        with: {prefix-key: rustdesk-lib-cache-android, key: "${{ env.T }}"}
      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          rustup target add $T
          cargo install cargo-ndk --version $CARGO_NDK_VERSION --locked
          ./flutter/ndk_arm64.sh
          J=flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $J
          cp target/$T/release/liblibrustdesk.so $J/librustdesk.so
          cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so $J/
          sed -i "s/-Xmx1024M/-Xmx2g/" flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" flutter/android/app/build.gradle
          cd flutter && flutter build apk --release --target-platform android-arm64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../RustDesk-HQ-arm64.apk
      - uses: actions/upload-artifact@v4
        with: {name: RustDesk-HQ-arm64, path: RustDesk-HQ-arm64.apk}
      - uses: softprops/action-gh-release@v2
        with: {prerelease: true, tag_name: hq, name: RustDesk HQ, files: RustDesk-HQ-arm64.apk}
